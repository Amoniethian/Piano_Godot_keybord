# ── JDK location ──────────────────────────────────────────────────────────────
# Point Gradle to the JBR bundled with Android Studio.
# Adjust this path if Android Studio is installed elsewhere on your machine.
org.gradle.java.home=D:\\Android\\jbr

# ── Gradle daemon JVM memory ──────────────────────────────────────────────────
org.gradle.jvmargs=-Xmx2g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# ── Build performance ─────────────────────────────────────────────────────────
org.gradle.parallel=true
org.gradle.caching=true

# ── Android ───────────────────────────────────────────────────────────────────
android.useAndroidX=true
