# ── JDK location ──────────────────────────────────────────────────────────────
# Gradle requires Java 17 or 21 (LTS). Java 25 is NOT yet supported.
#
# Option A – Use Android Studio's bundled JBR (recommended):
#   Uncomment and adjust the path below to your Android Studio installation.
#   Common paths:
#     Windows: D:\\Android\\jbr  OR  C:\\Program Files\\Android\\Android Studio\\jbr
#     macOS:   /Applications/Android Studio.app/Contents/jbr/Contents/Home
#   org.gradle.java.home=D:\\Android\\jbr
#
# Option B – Use a standalone JDK 17 or 21:
#   Set JAVA_HOME environment variable, or uncomment and set the path:
#   org.gradle.java.home=C:\\Program Files\\Java\\jdk-21
#
# NOTE: If you have Java 25 as your system Java, you MUST set one of the above.
#       Alternatively, in Godot editor: Editor Settings > Export > Android > Java SDK Path

# ── Gradle daemon JVM memory ──────────────────────────────────────────────────
org.gradle.jvmargs=-Xmx2g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# ── Build performance ─────────────────────────────────────────────────────────
org.gradle.parallel=true
org.gradle.caching=true

# ── Android ───────────────────────────────────────────────────────────────────
android.useAndroidX=true
